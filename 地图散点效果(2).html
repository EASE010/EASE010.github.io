<!--
    正文散点地图的单独预览页。

    正文（index.html）已经不再用 iframe 嵌入本页，而是直接挂载地图。
    两边都加载 js/scatter-map-cn.js，数据和样式都在那一份文件里。
-->
<!DOCTYPE html>
<html lang="zh-CN" style="height: 100%">
    <head>
        <meta charset="utf-8">
        <title>只有上海和河北能够承担</title>
        <style>
            html, body { height: 100%; margin: 0; background: #f6f4e7; }
            #container { height: 100%; }
            #fallback {
                display: none;
                font: 15px/1.6 "微软雅黑", sans-serif;
                color: #cc6633;
                padding: 40px;
                text-align: center;
            }
        </style>
    </head>
    <body>
        <div id="container"></div>
        <div id="fallback">地图加载失败，请刷新页面。</div>

        <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
        <script src="js/scatter-map-cn.js"></script>
        <script>
            initScatterMapCN({ container: 'container', fallback: 'fallback' });
        </script>
    </body>
</html>
