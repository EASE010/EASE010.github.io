<!--
    Total / one-child / second-child fertility rate, 2006-2020.

    Replaces a chart that was hosted on dycharts.com. That embed stamped a
    watermark over the plot (its own saved config says watermarkDisplay.show =
    false, so the watermark was added at render time and could not be turned
    off), and it was authored on a 600x470 canvas while the slot in the article
    is 400x300 — a 1.5x horizontal / 1.57x vertical squash. This version is
    drawn with D3 at the slot's real size, so nothing is scaled.

    Data, palette (#ff9966 / #99cc99 / #339966), y-range [0.3, 1.9] and 2px
    lines are carried over from the original chart's saved configuration.
    The title, the definitions, the legend and the source note live in the
    parent page's background image (PICS/0615生育率图/【英】生育率.png); this
    file draws only the plot that sits inside it.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fertility rate, 2006-2020</title>
<style>
    :root {
        /* Surface matches the article background, so the iframe has no seam. */
        --surface: #f6f4e7;
        --grid: #e6e1cd;        /* one step off the surface, per chart chrome */
        --axis: #cfc9b4;
        --ink-muted: #8a8474;
        --ink: #5a554a;
        --total: #ff9966;
        --one-child: #99cc99;
        --second-child: #339966;
    }
    html, body {
        margin: 0;
        height: 100%;
        background: var(--surface);
        font-family: "Segoe UI", Frutiger, "Helvetica Neue", Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
    }
    #chart { position: relative; width: 400px; height: 300px; }
    svg { display: block; }
    text { fill: var(--ink-muted); font-size: 9px; }
    .grid line { stroke: var(--grid); stroke-width: 1; shape-rendering: crispEdges; }
    .baseline { stroke: var(--axis); stroke-width: 1; shape-rendering: crispEdges; }
    .series-line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    /* The 2px ring is the surface colour, so dots stay legible where they
       cross a line or each other. */
    .dot { stroke: var(--surface); stroke-width: 2; }
    .end-label { fill: var(--ink); font-size: 9.5px; }
    .crosshair { stroke: var(--ink-muted); stroke-width: 1; opacity: 0; shape-rendering: crispEdges; }
    .hover-dot { opacity: 0; }
    #hit { fill: transparent; cursor: crosshair; }
    /* Keyboard users get a visible indicator; the plot rect is the focus target. */
    #hit:focus-visible { outline: 2px solid var(--ink-muted); outline-offset: 2px; }

    #tip {
        position: absolute;
        pointer-events: none;
        opacity: 0;
        transition: opacity .12s;
        background: #fffdf5;
        border: 1px solid #e0dac4;
        border-radius: 3px;
        padding: 5px 7px;
        font-size: 10px;
        color: var(--ink-muted);
        box-shadow: 0 1px 4px rgba(90, 85, 74, .16);
        white-space: nowrap;
        z-index: 2;
    }
    #tip .year { font-weight: 700; color: var(--ink); margin-bottom: 3px; font-size: 10.5px; }
    #tip table { border-collapse: collapse; }
    #tip td { padding: 1px 0; vertical-align: middle; }
    /* A short stroke of the series colour keys each row — at tooltip density a
       filled box is data-weight ink doing a label's job. */
    #tip td.key { width: 12px; }
    #tip td.key i { display: block; width: 10px; height: 2px; border-radius: 1px; }
    #tip td.name { padding-right: 8px; }
    /* Value leads: it is the strong, high-contrast element; the name is secondary. */
    #tip td.val { font-weight: 700; color: var(--ink); text-align: right; font-variant-numeric: tabular-nums; }

    /* Table view: every value stays reachable without hovering. */
    .visually-hidden {
        position: absolute; width: 1px; height: 1px;
        margin: -1px; padding: 0; overflow: hidden;
        clip: rect(0 0 0 0); white-space: nowrap; border: 0;
    }
</style>
</head>
<body>
<div id="chart">
    <div id="tip" role="status" aria-live="polite"></div>
</div>

<table id="data-table" class="visually-hidden"></table>

<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<script>
// Source: www.stats.gov.cn; www.kylc.com; Recent Levels and Trends of Fertility
// in China. One-child and second-child rates are unavailable for 2018-2020,
// which is the gap the parent image's footnote refers to.
const SERIES = [
    { key: 'total',  name: 'Total Fertility Rate',        short: 'Total',        color: '#ff9966' },
    { key: 'first',  name: 'One-child Fertility Rate',    short: 'One-child',    color: '#99cc99' },
    { key: 'second', name: 'Second-child Fertility Rate', short: 'Second-child', color: '#339966' }
];

const ROWS = [
    { year: 2006, total: 1.625, first: 0.899, second: 0.581 },
    { year: 2007, total: 1.691, first: 0.924, second: 0.619 },
    { year: 2008, total: 1.714, first: 0.939, second: 0.617 },
    { year: 2009, total: 1.677, first: 0.904, second: 0.614 },
    { year: 2010, total: 1.637, first: 0.892, second: 0.591 },
    { year: 2011, total: 1.613, first: 0.882, second: 0.574 },
    { year: 2012, total: 1.781, first: 0.955, second: 0.658 },
    { year: 2013, total: 1.554, first: 0.807, second: 0.593 },
    { year: 2014, total: 1.670, first: 0.809, second: 0.697 },
    { year: 2015, total: 1.410, first: 0.616, second: 0.643 },
    { year: 2016, total: 1.770, first: 0.668, second: 0.943 },
    { year: 2017, total: 1.719, first: 0.540, second: 1.013 },
    { year: 2018, total: 1.690, first: null,  second: null  },
    { year: 2019, total: 1.520, first: null,  second: null  },
    { year: 2020, total: 1.300, first: null,  second: null  }
];

const W = 400, H = 300;
const M = { top: 14, right: 46, bottom: 26, left: 32 };
const iw = W - M.left - M.right;
const ih = H - M.top - M.bottom;

const fmt = d3.format('.2f');
const years = ROWS.map(d => d.year);

const x = d3.scalePoint().domain(years).range([0, iw]);
const y = d3.scaleLinear().domain([0.3, 1.9]).range([ih, 0]);   // range from the original chart
const yTicks = d3.range(0.3, 1.91, 0.2);

const svg = d3.select('#chart').insert('svg', '#tip')
    .attr('width', W).attr('height', H)
    .attr('viewBox', `0 0 ${W} ${H}`)
    .attr('role', 'img')
    .attr('aria-labelledby', 'chart-title chart-desc');

svg.append('title').attr('id', 'chart-title')
    .text('Total, one-child and second-child fertility rate in China, 2006 to 2020');
svg.append('desc').attr('id', 'chart-desc')
    .text('The total fertility rate rises to 1.77 in 2016, the year every couple '
        + 'could legally have a second child, then falls to 1.30 by 2020. The '
        + 'one-child rate declines steadily from 0.96 in 2012 to 0.54 in 2017 '
        + 'while the second-child rate climbs to 1.01, so the second-child policy '
        + 'shifted the composition of births rather than raising the total.');

const g = svg.append('g').attr('transform', `translate(${M.left},${M.top})`);

// --- grid, axes -------------------------------------------------------------
// Hairline, solid, one step off the surface: present enough to read a value
// against, quiet enough to stay behind the data.
g.append('g').attr('class', 'grid')
  .selectAll('line').data(yTicks).join('line')
    .attr('x1', 0).attr('x2', iw)
    .attr('y1', d => y(d)).attr('y2', d => y(d));

g.append('g')
  .selectAll('text').data(yTicks).join('text')
    .attr('x', -7).attr('y', d => y(d))
    .attr('text-anchor', 'end').attr('dominant-baseline', 'middle')
    .text(d => d3.format('.1f')(d));

g.append('line').attr('class', 'baseline')
    .attr('x1', 0).attr('x2', iw).attr('y1', ih).attr('y2', ih);

// Every other year: 15 labels in 322px would collide.
g.append('g')
  .selectAll('text').data(years.filter((d, i) => i % 2 === 0)).join('text')
    .attr('x', d => x(d)).attr('y', ih + 13)
    .attr('text-anchor', 'middle')
    .text(d => d);

// --- lines ------------------------------------------------------------------
// curveLinear, not a smoothed spline: a curve through these 15 points would
// invent intermediate values the sources do not contain.
SERIES.forEach(s => {
    const shaped = d3.line()
        .defined(d => d[s.key] !== null)
        .x(d => x(d.year))
        .y(d => y(d[s.key]))
        .curve(d3.curveLinear);

    g.append('path')
        .datum(ROWS)
        .attr('class', 'series-line')
        .attr('stroke', s.color)
        .attr('d', shaped);

    // End dot + label. The dot carries the colour; the label stays in ink, so
    // identity never depends on reading colour out of small text.
    const last = [...ROWS].reverse().find(d => d[s.key] !== null);
    g.append('circle').attr('class', 'dot')
        .attr('cx', x(last.year)).attr('cy', y(last[s.key])).attr('r', 3.5)
        .attr('fill', s.color);
    g.append('text').attr('class', 'end-label')
        .attr('x', x(last.year) + 7).attr('y', y(last[s.key]))
        .attr('dominant-baseline', 'middle')
        .text(s.short);
});

// --- hover / focus layer ----------------------------------------------------
const crosshair = g.append('line').attr('class', 'crosshair')
    .attr('y1', 0).attr('y2', ih);

const hoverDots = g.append('g').attr('class', 'hover-dot')
  .selectAll('circle').data(SERIES).join('circle')
    .attr('class', 'dot').attr('r', 3.5)
    .attr('fill', d => d.color);

const tip = document.getElementById('tip');
let active = null;

function nearestYear(px) {
    const i = d3.leastIndex(years, a => Math.abs(x(a) - px));
    return years[i];
}

function show(year) {
    active = year;
    const row = ROWS.find(d => d.year === year);
    crosshair.attr('x1', x(year)).attr('x2', x(year)).attr('opacity', 0.5);

    g.select('.hover-dot').attr('opacity', 1);
    hoverDots
        .attr('cx', x(year))
        .attr('cy', d => row[d.key] === null ? -99 : y(row[d.key]))
        .attr('opacity', d => row[d.key] === null ? 0 : 1);

    // Built with DOM nodes and textContent: series names are data, never markup.
    tip.textContent = '';
    const head = document.createElement('div');
    head.className = 'year';
    head.textContent = year;
    tip.appendChild(head);

    const table = document.createElement('table');
    SERIES.forEach(s => {
        const tr = table.insertRow();
        const k = tr.insertCell(); k.className = 'key';
        const i = document.createElement('i');
        i.style.background = s.color;
        k.appendChild(i);
        const n = tr.insertCell(); n.className = 'name';
        // Short form: in a 400px plot the full names make a tooltip wide enough
        // to bury the line it is describing. The full names are in the page's
        // legend directly above the chart, and in the table view below.
        n.textContent = s.short;
        const v = tr.insertCell(); v.className = 'val';
        v.textContent = row[s.key] === null ? 'no data' : fmt(row[s.key]);
    });
    tip.appendChild(table);
    tip.style.opacity = 1;

    // Clamp inside the 400x300 frame: the iframe cannot overflow into the page.
    const tw = tip.offsetWidth, th = tip.offsetHeight;
    let left = M.left + x(year) + 12;
    if (left + tw > W - 2) left = M.left + x(year) - tw - 12;
    left = Math.max(2, Math.min(left, W - tw - 2));
    let top = M.top + 4;
    top = Math.max(2, Math.min(top, H - th - 2));
    tip.style.left = left + 'px';
    tip.style.top = top + 'px';
}

function hide() {
    active = null;
    crosshair.attr('opacity', 0);
    g.select('.hover-dot').attr('opacity', 0);
    tip.style.opacity = 0;
}

// The hit area is the whole plot, so the reader aims at a year, never at a 2px line.
g.append('rect').attr('id', 'hit')
    .attr('x', 0).attr('y', 0).attr('width', iw).attr('height', ih)
    .attr('tabindex', 0)
    .attr('aria-label', 'Fertility rate by year. Use the left and right arrow keys to read each year.')
    // Both pointer and mouse events: some embedded/automated browsers deliver
    // only the mouse pair, and show() is idempotent so double delivery is free.
    .on('pointermove mousemove', function (event) { show(nearestYear(d3.pointer(event, this)[0])); })
    .on('pointerleave mouseleave', hide)
    .on('focus', function () { show(active ?? years[years.length - 1]); })
    .on('blur', hide)
    .on('keydown', function (event) {
        const i = years.indexOf(active ?? years[years.length - 1]);
        if (event.key === 'ArrowRight') { show(years[Math.min(i + 1, years.length - 1)]); event.preventDefault(); }
        if (event.key === 'ArrowLeft')  { show(years[Math.max(i - 1, 0)]); event.preventDefault(); }
        if (event.key === 'Escape') hide();
    });

// --- table view -------------------------------------------------------------
const t = d3.select('#data-table');
t.append('caption').text('Fertility rate in China by year, 2006 to 2020');
t.append('thead').append('tr')
  .selectAll('th').data(['Year', ...SERIES.map(s => s.name)]).join('th')
    .attr('scope', 'col').text(d => d);
t.append('tbody')
  .selectAll('tr').data(ROWS).join('tr')
  .selectAll('td').data(r => [r.year, ...SERIES.map(s => r[s.key] === null ? 'no data' : fmt(r[s.key]))])
  .join('td').text(d => d);
</script>
</body>
</html>
