<!--
    Standalone preview of the article's scatter map.

    The article (indexen.html) no longer embeds this page in an iframe — it
    mounts the map directly. Both load js/scatter-map-en.js, which holds the
    data and all the styling, so there is only one copy to edit.
-->
<!DOCTYPE html>
<html lang="en" style="height: 100%">
    <head>
        <meta charset="utf-8">
        <title>Only Shanghai and Hebei Residents can Afford Housework Compensation</title>
        <style>
            html, body { height: 100%; margin: 0; background: #f6f4e7; }
            #container { height: 100%; }
            #fallback {
                display: none;
                font: 15px/1.6 Optima, Georgia, serif;
                color: #cc6633;
                padding: 40px;
                text-align: center;
            }
        </style>
    </head>
    <body>
        <div id="container"></div>
        <div id="fallback">The map could not be loaded. Please refresh the page.</div>

        <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
        <script src="js/scatter-map-en.js"></script>
        <script>
            initScatterMapEN({ container: 'container', fallback: 'fallback' });
        </script>
    </body>
</html>
